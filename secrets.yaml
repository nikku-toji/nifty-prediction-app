---
# secrets.yaml
# Store sensitive credentials — base64 encode your values:
#   echo -n "YOUR_VALUE" | base64
# NEVER commit real keys to git. Use a .gitignore or vault.

apiVersion: v1
kind: Secret
metadata:
  name: algo-trading-secrets
  namespace: algo-trading
type: Opaque
data:
  # Angel One API credentials (replace with your base64-encoded values)
  ANGEL_ONE_API_KEY: REPLACE_BASE64_ENCODED_API_KEY
  ANGEL_ONE_CLIENT_ID: REPLACE_BASE64_ENCODED_CLIENT_ID
  ANGEL_ONE_PASSWORD: REPLACE_BASE64_ENCODED_PASSWORD
  ANGEL_ONE_TOTP_SECRET: REPLACE_BASE64_ENCODED_TOTP_SECRET

  # News API for geopolitical sentiment
  NEWS_API_KEY: REPLACE_BASE64_ENCODED_NEWS_API_KEY
